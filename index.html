<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-enabled Contract Lifecycle Management interactive prototype" />
    <title>Contract Lifecycle Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <header class="brand-row">
          <button class="brand" id="brandHome" aria-label="Go to dashboard">
            <img src="assets/logo.png" alt="Société Générale" />
            <span>Contract Lifecycle Management</span>
          </button>
          <div class="header-actions">
            <button class="icon-button" id="searchButton" aria-label="Search recent conversations"><img src="assets/search.png" alt="" /></button>
            <button class="icon-button" id="collapseButton" aria-label="Collapse sidebar"><img src="assets/collapse.png" alt="" /></button>
          </div>
        </header>
        <button class="new-chat" id="newChatButton"><span class="plus-crop" aria-hidden="true"><img src="assets/new-chat.png" alt="" /></span><span>New chat</span></button>
        <nav class="primary-nav" aria-label="Primary navigation">
          <button class="nav-item" data-section="Approvals"><img src="assets/approvals.png" alt="" /><span>Approvals</span><strong>2</strong></button>
          <button class="nav-item" data-section="Contracts"><img src="assets/contracts.png" alt="" /><span>Contracts</span></button>
          <button class="nav-item" data-section="My requests"><img src="assets/requests.png" alt="" /><span>My requests</span></button>
          <button class="nav-item" data-section="Supplier"><img src="assets/supplier.png" alt="" /><span>Supplier</span></button>
          <button class="nav-item" data-section="Insights"><img src="assets/insight.png" alt="" /><span>Insights</span></button>
        </nav>
        <section class="recents">
          <button class="section-label" id="recentsToggle" aria-expanded="true"><img src="assets/down.png" alt="" /><span>Recents</span></button>
          <div class="search-box" id="searchBox" hidden><input id="recentSearch" type="search" placeholder="Search conversations" aria-label="Search conversations" /></div>
          <div class="recent-list" id="recentList">
            <button class="recent-item selected" data-request="REQ-2026-0187"><span class="bubble">○</span><span><b>REQ-2026-0187</b><small>Today, 10:24</small></span></button>
            <button class="recent-item" data-request="Renewal review - Cloud"><span class="bubble">○</span><span><b>Renewal review - Cloud</b><small>Yesterday, 15:10</small></span></button>
            <button class="recent-item" data-request="Supplier onboarding"><span class="bubble">○</span><span><b>Supplier onboarding</b><small>12 Sep 2026</small></span></button>
            <button class="recent-item" data-request="Clause clarification"><span class="bubble">○</span><span><b>Clause clarification</b><small>10 Sep 2026</small></span></button>
            <button class="recent-item" data-request="Risk review - Data privacy"><span class="bubble">○</span><span><b>Risk review - Data privacy</b><small>8 Sep 2026</small></span></button>
          </div>
        </section>
        <footer class="profile">
          <div class="avatar"><img src="assets/profile.png" alt="" /></div>
          <span><b>Catherine Moreau</b><small>Contract Manager</small></span>
          <button class="more" aria-label="Profile options">•••</button>
        </footer>
      </aside>
      <main class="workspace" id="workspace">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div id="appView"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
